name: Moc Nhien Toan 3 - Approved UI update
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [native-curriculum-1.1, part2-game-integration, v1.2-part01-modules, v1.2-part02-migration, v1.2-part03-migration, v1.2-part04-migration, v1.2-part05-review, v1.2-part05-kotlin-migration, v1.2-part06-migration, v1.2-part07-rainbow]
  push:
    branches: [v1.2.1-ui]
    paths: ['.github/workflows/verify-native.yml', 'app/src/**', 'app/build.gradle', 'tools/**', 'tests/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: native-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      apk_sha: ${{ steps.package.outputs.apk_sha }}
      apk_bytes: ${{ steps.package.outputs.apk_bytes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mocnhien-new-debug-keystore-v1
      - name: Verify UI-only scope against tested APK 48
        run: |
          python3 - <<'PY'
          import subprocess
          base="94577c1a361365ff852b0e8eb93e02a12dca6654"
          allowed=set(["app/src/main/AndroidManifest.xml","app/build.gradle","app/src/main/res/values/styles.xml","app/src/main/java/vn/mocnhien/toan3/MainActivity.java","app/src/main/java/vn/mocnhien/toan3/NativeUi.java","app/src/main/java/vn/mocnhien/toan3/AdventureScene.java","app/src/main/java/vn/mocnhien/toan3/StoryArt.java","app/src/main/java/vn/mocnhien/toan3/AdventurePanel.java","app/src/main/java/vn/mocnhien/toan3/LearningModule.java","app/src/main/java/vn/mocnhien/toan3/ModulePage.java","app/src/main/java/vn/mocnhien/toan3/QuestionPanel.java","app/src/main/kotlin/vn/mocnhien/toan3/AppModule.kt","app/src/main/kotlin/vn/mocnhien/toan3/ModuleHome.kt","app/src/main/kotlin/vn/mocnhien/toan3/RewardsModule.kt","app/src/main/assets/ui/hero.webp","app/src/main/assets/ui/book.webp","app/src/main/assets/ui/practice.webp","app/src/main/assets/ui/game.webp","app/src/main/assets/ui/reward.webp","app/src/test/java/vn/mocnhien/toan3/KotlinShellParityTest.java",".github/scripts/part4_smoke.py",".github/scripts/ui_upgrade_smoke.py",".github/workflows/verify-native.yml"])
          changed=set(subprocess.check_output(["git","diff","--no-renames","--name-only",base,"HEAD"],text=True).splitlines())
          assert changed<=allowed,changed-allowed
          print("UI_SCOPE_PASS",sorted(changed))
          PY
      - name: Test bounded Android viewport search
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_ui_scan.py' -v
          python3 -m py_compile .github/scripts/part4_smoke.py
      - name: Verify data and compile Kotlin and Java
        run: |
          set -euo pipefail
          node tests/verify_curriculum_v2.mjs
          # Kotlin pilot needs one-time plugin resolution; Gradle still reuses its cache.
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/kotlin-build.log; then
              test -f app/build/tmp/kotlin-classes/debug/vn/mocnhien/toan3/AppModule.class
              test -f app/build/tmp/kotlin-classes/debug/vn/mocnhien/toan3/ModuleHome.class
              for cls in GameModule CandyStationSession CandyStationPanel RainbowStationSession RainbowStationPanel FinalStationSession FinalStationPanel RewardsModule ProgressModule; do
                test -f app/build/tmp/kotlin-classes/debug/vn/mocnhien/toan3/$cls.class
              done
              echo KOTLIN_CLASSES_COMPILED
              exit 0
            fi
            if ! grep -Eqi 'Received status code (429|502|503|504)|Too Many Requests|Read timed out|Connect timed out|Connection reset' /tmp/kotlin-build.log; then exit 1; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Print test details on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          print(case.attrib.get("name"), node.attrib.get("message"), node.text or "")
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Package and verify the exact tested APK
        id: package
        run: |
          set -euo pipefail
          mkdir -p output
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk output/MocNhien-Toan3-1.2.1-ui.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/MocNhien-Toan3-1.2.1-ui.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/MocNhien-Toan3-1.2.1-ui.apk | tee output/badging.txt
          grep -F "package: name='vn.mocnhien.toan3' versionCode='20' versionName='1.2.1-ui'" output/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions output/MocNhien-Toan3-1.2.1-ui.apk | tee output/permissions.txt
          ! grep -F 'android.permission.INTERNET' output/permissions.txt
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib
          p=pathlib.Path("output/MocNhien-Toan3-1.2.1-ui.apk")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert {'AndroidManifest.xml','classes.dex','assets/runtime_v2.json'} <= set(z.namelist())
              data=json.loads(z.read('assets/runtime_v2.json'))
              assert len(data['lessons'])==19
              assert data['recordCount']==959
              assert hashlib.sha256(z.read('assets/runtime_v2.json')).hexdigest()=='ae6cf6e94c017bdcbfdc008cb91c4c9472a53a34e9a20a4bcf70c009a38193e3'
              print("APK_ZIP_PASS",p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          sha256sum output/MocNhien-Toan3-1.2.1-ui.apk > output/SHA256SUMS.txt
          echo "apk_sha=$(cut -d ' ' -f 1 output/SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "apk_bytes=$(stat -c %s output/MocNhien-Toan3-1.2.1-ui.apk)" >> "$GITHUB_OUTPUT"
      - name: Upload verified installation candidate
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.1-ui
          path: output/MocNhien-Toan3-1.2.1-ui.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CANDIDATE_SHA: ${{ needs.verify.outputs.apk_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.1-ui
          path: output
      - name: Verify exact installation candidate
        run: |
          printf '%s  %s\n' "$CANDIDATE_SHA" output/MocNhien-Toan3-1.2.1-ui.apk | sha256sum -c -
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual APK on Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/part4_smoke.py
      - name: Upload actual screenshots and package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-1.2.1-ui-QA
          path: |
            screenshots/
            output/*.txt
          if-no-files-found: warn
          retention-days: 30

  upgrade:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ needs.verify.outputs.apk_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.0-p15
          run-id: 45560209705
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.1-ui
          path: output
      - name: Check original and candidate digests
        run: |
          echo '1b6c1e5c6d219ae49652ac11bb115894b25cf3bf0b56b0cd742641266f933391  original/MocNhien-Toan3-1.2.0-p15.apk' | sha256sum -c -
          printf '%s  %s\n' "$CANDIDATE_SHA" output/MocNhien-Toan3-1.2.1-ui.apk | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify in-place update on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/ui_upgrade_smoke.py original/MocNhien-Toan3-1.2.0-p15.apk output/MocNhien-Toan3-1.2.1-ui.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-upgrade-QA
          path: ui-upgrade-qa/
          if-no-files-found: warn
  acceptance:
    needs: [verify, android, upgrade]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.1-ui
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-1.2.1-ui-QA
          path: qa
      - name: Check screenshot coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shots=list(Path("qa").rglob("*.png"))
          assert len(shots)>=100,len(shots)
          for name in ["M01-home-four-modules","M02-learning","UI-practice-index","M04-rewards","04-adventure-forest"]:
              assert any(p.stem==name for p in shots),name
          PY
          echo "${{ needs.verify.outputs.apk_sha }}  verified/MocNhien-Toan3-1.2.1-ui.apk" | sha256sum -c -
      - name: Prepare single installation file for visual review
        run: mv verified/MocNhien-Toan3-1.2.1-ui.apk verified/MocNhien-Toan3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MocNhien-Toan3-final-candidate
          path: verified/MocNhien-Toan3.apk
          if-no-files-found: error
