name: Verify exact p05-k01 to p06 migration
on:
  pull_request:
    branches: [v1.2-part06-candy]
    paths: ['migration/**', '.github/workflows/verify-progress-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tested p06 sources remain unchanged
        run: git diff --exit-code e60bb0713983abde9ca60785b4cf4f2c064090bc HEAD -- build.gradle app tools tests .github/scripts .github/workflows/verify-native.yml
      - name: Test migration safeguards
        run: python3 -m unittest discover -s migration -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.0-p05-k01
          run-id: 45540144790
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: migration-apks/p05-k01
      - uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.0-p06
          run-id: 45544219876
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: migration-apks/p06
      - name: Check original APK digests
        run: |
          echo '4aa8a16e558e6a88a95f654178ca3067b38d087abf9aede535b97416b41ab4b4  migration-apks/p05-k01/MocNhien-Toan3-1.2.0-p05-k01.apk' | sha256sum -c -
          echo 'a189e416e4d261dbf14bdb7c97fb75861f99a61e573412fd978a61dfd9956d02  migration-apks/p06/MocNhien-Toan3-1.2.0-p06.apk' | sha256sum -c -
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual migration and recovery on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 migration/migration_emulator.py migration-apks/p05-k01/MocNhien-Toan3-1.2.0-p05-k01.apk migration-apks/p06/MocNhien-Toan3-1.2.0-p06.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MocNhien-p06-migration-QA
          path: migration-qa/
          if-no-files-found: warn
