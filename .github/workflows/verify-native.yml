name: Verify native Android curriculum
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [native-curriculum-1.1]
  push:
    branches: [native-curriculum-1.1]
    paths: ['.github/workflows/verify-native.yml', 'app/src/**', 'app/build.gradle', 'tools/**', 'tests/**']
permissions:
  contents: read
concurrency:
  group: native-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mocnhien-new-debug-keystore-v1
      - name: Verify data and compile Java
        run: |
          node tests/verify_curriculum_v2.mjs
          set -euo pipefail
          # Prefer the verified Gradle cache. If incomplete, resolve online.
          # Only retry dependency transport errors; never mask test or compiler failures.
          if gradle --offline --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/native-offline.log; then
            exit 0
          fi
          if ! grep -Eqi 'offline mode|no cached version|not available for offline' /tmp/native-offline.log; then
            exit 1
          fi
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/native-online.log; then
              exit 0
            fi
            if ! grep -Eqi 'Received status code (429|502|503|504)|Too Many Requests|Read timed out|Connect timed out|Connection reset' /tmp/native-online.log; then
              exit 1
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Print test details on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          print(case.attrib.get("name"), node.attrib.get("message"), node.text or "")
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Package and verify the exact tested APK
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/MocNhien-Toan3-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/MocNhien-Toan3-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/MocNhien-Toan3-1.1.0.apk | tee output/badging.txt
          grep -F "package: name='vn.mocnhien.toan3' versionCode='2' versionName='1.1.0'" output/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions output/MocNhien-Toan3-1.1.0.apk | tee output/permissions.txt
          ! grep -F 'android.permission.INTERNET' output/permissions.txt
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib
          p=pathlib.Path("output/MocNhien-Toan3-1.1.0.apk")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert {'AndroidManifest.xml','classes.dex','assets/runtime_v2.json'} <= set(z.namelist())
              data=json.loads(z.read('assets/runtime_v2.json'))
              assert len(data['lessons'])==19
              print("APK_ZIP_PASS",p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          sha256sum output/MocNhien-Toan3-1.1.0.apk > output/SHA256SUMS.txt
      - name: Upload verified installation candidate
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-Toan3-1.1.0
          path: output/MocNhien-Toan3-1.1.0.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual APK on Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/part4_smoke.py
      - name: Upload actual screenshots and package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-1.1.0-QA
          path: |
            screenshots/
            output/*.txt
          if-no-files-found: warn
          retention-days: 30
