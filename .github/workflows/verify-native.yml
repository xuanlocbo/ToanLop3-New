name: Verify native Android curriculum
on:
  workflow_dispatch:
  pull_request:
    branches: [native-curriculum-1.1]
  push:
    branches: [native-curriculum-1.1]
    paths: ['.github/workflows/verify-native.yml', 'app/src/**', 'app/build.gradle', 'tools/**', 'tests/**']
permissions:
  contents: read
concurrency:
  group: native-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify data and compile Java
        run: |
          node tests/verify_curriculum_v2.mjs
          set -euo pipefail
          # Prefer the verified Gradle cache. If incomplete, resolve online.
          # Only retry dependency transport errors; never mask test or compiler failures.
          if gradle --offline --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/native-offline.log; then
            exit 0
          fi
          if ! grep -Eqi 'offline mode|no cached version|not available for offline' /tmp/native-offline.log; then
            exit 1
          fi
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/native-online.log; then
              exit 0
            fi
            if ! grep -Eqi 'Received status code (429|502|503|504)|Too Many Requests|Read timed out|Connect timed out|Connection reset' /tmp/native-online.log; then
              exit 1
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Print test details on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          print(case.attrib.get("name"), node.attrib.get("message"), node.text or "")
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
