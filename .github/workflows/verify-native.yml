name: Verify native Android curriculum
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [native-curriculum-1.1, part2-game-integration, v1.2-part01-modules, v1.2-part02-migration, v1.2-part03-migration, v1.2-part04-migration, v1.2-part05-review, v1.2-part05-kotlin-migration]
  push:
    branches: [native-curriculum-1.1]
    paths: ['.github/workflows/verify-native.yml', 'app/src/**', 'app/build.gradle', 'tools/**', 'tests/**']
permissions:
  contents: read
concurrency:
  group: native-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mocnhien-new-debug-keystore-v1
      - name: Verify part-06 protected baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base="b151bd5a2259cb29615057f91f89cb082fc97f51"
          allowed={"app/build.gradle",".github/workflows/verify-native.yml",".github/scripts/part4_smoke.py",
                   "docs/15-part-handoff.md","docs/kotlin-migration.md","docs/remaining-plan.md",
                   "app/src/main/java/vn/mocnhien/toan3/MainActivity.java","app/src/main/java/vn/mocnhien/toan3/GameModule.java",
                   "app/src/main/kotlin/vn/mocnhien/toan3/GameModule.kt","app/src/main/kotlin/vn/mocnhien/toan3/CandyStationSession.kt","app/src/main/kotlin/vn/mocnhien/toan3/CandyStationPanel.kt",
                   "app/src/test/java/vn/mocnhien/toan3/CandyStationTest.java"}
          changed=set(subprocess.check_output(["git","diff","--no-renames","--name-only",base,"HEAD"],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          assert not Path("app/src/main/java/vn/mocnhien/toan3/GameModule.java").exists()
          for cls in ("GameModule","CandyStationSession","CandyStationPanel"):
              assert Path("app/src/main/kotlin/vn/mocnhien/toan3/"+cls+".kt").is_file()
          print("PART06_PROTECTED_BASELINE_PASS",sorted(changed))
          PY
      - name: Verify data and compile Kotlin and Java
        run: |
          set -euo pipefail
          node tests/verify_curriculum_v2.mjs
          # Kotlin pilot needs one-time plugin resolution; Gradle still reuses its cache.
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/kotlin-build.log; then
              test -f app/build/tmp/kotlin-classes/debug/vn/mocnhien/toan3/AppModule.class
              test -f app/build/tmp/kotlin-classes/debug/vn/mocnhien/toan3/ModuleHome.class
              for cls in GameModule CandyStationSession CandyStationPanel; do
                test -f app/build/tmp/kotlin-classes/debug/vn/mocnhien/toan3/$cls.class
              done
              echo KOTLIN_CLASSES_COMPILED
              exit 0
            fi
            if ! grep -Eqi 'Received status code (429|502|503|504)|Too Many Requests|Read timed out|Connect timed out|Connection reset' /tmp/kotlin-build.log; then exit 1; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Print test details on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          print(case.attrib.get("name"), node.attrib.get("message"), node.text or "")
          PY
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Package and verify the exact tested APK
        run: |
          set -euo pipefail
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/MocNhien-Toan3-1.2.0-p06.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/MocNhien-Toan3-1.2.0-p06.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/MocNhien-Toan3-1.2.0-p06.apk | tee output/badging.txt
          grep -F "package: name='vn.mocnhien.toan3' versionCode='10' versionName='1.2.0-p06'" output/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions output/MocNhien-Toan3-1.2.0-p06.apk | tee output/permissions.txt
          ! grep -F 'android.permission.INTERNET' output/permissions.txt
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib
          p=pathlib.Path("output/MocNhien-Toan3-1.2.0-p06.apk")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert {'AndroidManifest.xml','classes.dex','assets/runtime_v2.json'} <= set(z.namelist())
              data=json.loads(z.read('assets/runtime_v2.json'))
              assert len(data['lessons'])==19
              assert data['recordCount']==959
              assert hashlib.sha256(z.read('assets/runtime_v2.json')).hexdigest()=='ae6cf6e94c017bdcbfdc008cb91c4c9472a53a34e9a20a4bcf70c009a38193e3'
              print("APK_ZIP_PASS",p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          sha256sum output/MocNhien-Toan3-1.2.0-p06.apk > output/SHA256SUMS.txt
      - name: Upload verified installation candidate
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-Toan3-1.2.0-p06
          path: output/MocNhien-Toan3-1.2.0-p06.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual APK on Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/part4_smoke.py
      - name: Upload actual screenshots and package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-1.2.0-p06-QA
          path: |
            screenshots/
            output/*.txt
          if-no-files-found: warn
          retention-days: 30
