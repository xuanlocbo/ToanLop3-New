name: Capture app screenshots
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful Build Android APK run ID'
        required: true
        default: '45417236028'
  push:
    branches: [main]
    paths: ['.github/workflows/capture-screenshots.yml', '.github/scripts/capture_screenshots.py']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing verified APK
        uses: actions/download-artifact@v4
        with:
          name: MocNhien-Toan3-1.0.0
          run-id: ${{ inputs.build_run || '45417236028' }}
          github-token: ${{ github.token }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and capture real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/capture_screenshots.py
      - name: Upload actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MocNhien-Actual-Screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30
